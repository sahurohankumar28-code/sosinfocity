name: 2-Hour RSS News Sync and Cleanup

on:
  schedule:
    # Runs every 2 hours (minute 0 of every second hour)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Grants permission to commit updated news.json back to repo

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./nexus-blog/automation
        run: npm install

      - name: Run Fetch and Purge Script
        working-directory: ./nexus-blog/automation
        run: node fetch_news.js

      - name: Commit and push updated news.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nexus-blog/automation/data/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync RSS news feed [skip ci]" && git push)
